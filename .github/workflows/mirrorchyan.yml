name: mirrorchyan

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mirrorchyan:
    # UI 暂不向 MirrorChyan 上传
    if: false
    # if: github.repository_owner == 'overflow65537'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        os: [win, macos, linux]
        arch: [aarch64, x86_64]

    steps:
      # 包名仍是 MFW-PyQt6-{os}-{arch}-{tag}；扩展名 zip/tar.gz 都要能匹配
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MFW-PyQt6-{0}-{1}-*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MFW-PyQt6

          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
