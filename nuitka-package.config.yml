# maa 运行时从 bin、bin/plugins 动态加载原生库；standalone 编译期需显式收录。
# 整包由 Nuitka --include-package=maa 与本 dlls 规则纳入产物，不再由 build_nuitka 手动拷贝。
---
- module-name: 'maa'
  dlls:
    - from_filenames:
        relative_path: 'bin'
        prefixes:
          - '*'
    - from_filenames:
        relative_path: 'bin/plugins'
        prefixes:
          - '*'

# 仅 macOS：ADB 代理（minicap 等）按 data-files 拷贝，配合 main.py 中 Darwin 条件 noinclude-dlls。
- module-name: 'MaaAgentBinary'
  data-files:
    - dirs:
        - 'minicap'
        - 'minitouch'
        - 'maatouch'
      when: 'macos'
